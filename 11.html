<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>多啦夢の小天地</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #eaf7ff;
  font-family: "Microsoft JhengHei", Arial, sans-serif;
  text-align: center;
}

.main {
  max-width: 900px;
  margin: 20px auto;
}

.banner {
  position: relative;
  width: 100%;
}

.banner img {
  display: block;
  width: 100%;
  height: auto;
  border: 5px solid white;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0, 100, 180, 0.15);
}

/* 粉紅色按鈕的點擊範圍 */
.watch-button {
  position: absolute;
  left: 50%;
  top: 74.5%;
  transform: translate(-50%, -50%);
  width: 31%;
  height: 13%;
  display: block;
  border-radius: 50px;
  cursor: pointer;
}

.watch-button:focus-visible {
  outline: 3px solid white;
}

.footer {
  margin-top: 20px;
  color: #5c9bc4;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="main">

  <div class="banner">

    <img
      src="https://i.ibb.co/HfXNMhbd/0b966f1a-011c-4479-beef-8dd7458fc99b.png"
      alt="多啦夢の小天地"
    >

    <a
      class="watch-button"
      href="https://docs.google.com/forms/d/e/1FAIpQLSejC4wirFDtri6QNGpalSxk47v1a-lke_gMEE04keOsJrSIkg/viewform?usp=dialog"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="點擊我觀看"
    ></a>

  </div>

  <p class="footer">
    ♥️ 歡迎光臨，祝你有美好的一天 ♥️
  </p>

</div>

</body>
</html>
